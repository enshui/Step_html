<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小米步数 · 每日记录</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF6900'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='27' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EMI%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #e4e7ec;
    --text: #1f2430; --muted: #6b7280; --accent: #d40511;
    --accent-soft: #fdecec; --shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --panel: #1f2229; --border: #333845;
      --text: #e8eaf0; --muted: #9aa1ad; --accent: #ff5a63;
      --accent-soft: #3a2326; --shadow: 0 4px 16px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px 20px 60px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }

  /* ---------- 筛选区 ---------- */
  .filters { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; padding: 16px 18px; margin-bottom: 18px; position: relative; z-index: 20; }
  .fg { display: flex; flex-direction: column; gap: 6px; }
  .fg > label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: border-color .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .popwrap { position: relative; display: inline-block; }
  .popup {
    position: absolute; top: calc(100% + 6px); left: 0; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
    padding: 14px; z-index: 50; display: none;
  }
  .popup.open { display: block; }
  /* 日历 */
  #calPop { width: 560px; max-width: calc(100vw - 40px); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav { display: flex; gap: 6px; align-items: center; }
  .cal-nav button { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; }
  .cal-nav button:hover { border-color: var(--accent); }
  .cal-title { font-size: 13px; font-weight: 600; }
  .cal-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .cal-quick button { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 20px; padding: 3px 12px; font-size: 12px; cursor: pointer; }
  .cal-quick button:hover { color: var(--accent); border-color: var(--accent); }
  .cal-months { display: flex; gap: 24px; }
  .cal-month { flex: 1; min-width: 0; }
  .cal-month h4 { font-size: 13px; text-align: center; margin-bottom: 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-grid .dow { font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0; }
  .cal-day {
    text-align: center; padding: 6px 0; font-size: 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; user-select: none;
  }
  .cal-day:hover { background: var(--accent-soft); }
  .cal-day.dim { color: var(--muted); opacity: .45; }
  .cal-day.hasdata::after { content: ""; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin: 1px auto 0; }
  .cal-day.inrange { background: var(--accent-soft); border-radius: 0; }
  .cal-day.selstart, .cal-day.selend { background: var(--accent); color: #fff; }
  .cal-day.selstart { border-radius: 6px 0 0 6px; }
  .cal-day.selend { border-radius: 0 6px 6px 0; }
  .cal-day.samesel { border-radius: 6px !important; }
  .cal-foot { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .cal-foot .apply { border: 0; background: var(--accent); color: #fff; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 12px; }
  /* 账号弹层 */
  #accPop { width: 300px; max-height: 420px; overflow: auto; }
  .acc-actions { display: flex; gap: 8px; margin-bottom: 10px; }
  .acc-actions button { flex: 1; border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 6px; padding: 5px 0; font-size: 12px; cursor: pointer; }
  .acc-actions button:hover { color: var(--accent); border-color: var(--accent); }
  .acc-item { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 13px; cursor: pointer; border-radius: 6px; }
  .acc-item:hover { background: var(--accent-soft); }
  .acc-item input { accent-color: var(--accent); }

  /* ---------- 汇总条 ---------- */
  .summary-strip {
    display: flex; gap: 20px; flex-wrap: wrap; padding: 12px 6px;
    color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  .summary-strip b { color: var(--text); font-variant-numeric: tabular-nums; }

  /* ---------- 账号榜单 ---------- */
  .rank-panel { padding: 10px 18px 14px; margin-bottom: 18px; }
  .acc-row { display: flex; align-items: center; gap: 14px; padding: 11px 4px; }
  .acc-row + .acc-row { border-top: 1px solid var(--border); }
  .rank-no { width: 30px; text-align: center; font-size: 15px; font-weight: 700; color: var(--muted); flex: none; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 14px; text-transform: uppercase;
  }
  .acc-main { flex: 1; min-width: 0; }
  .acc-name { font-size: 14px; font-weight: 600; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { height: 8px; background: rgba(128,128,128,.15); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; min-width: 3px; transition: width .4s ease; }
  .acc-val { flex: none; width: 158px; text-align: right; }
  .acc-val .num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
  .acc-val .unit { font-size: 11px; color: var(--muted); margin-left: 2px; }
  .acc-val .extra { font-size: 11px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); text-align: center; padding: 50px 0; font-size: 14px; }

  /* ---------- 明细表 ---------- */
  .table-panel { overflow: auto; max-height: 520px; margin-bottom: 18px; }
  .table-title { padding: 12px 18px 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
  th, td { padding: 8px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th { position: sticky; top: 0; background: var(--panel); z-index: 5; text-align: right; font-size: 12px; }
  thead th:first-child { text-align: left; position: sticky; left: 0; top: 0; z-index: 7; }
  thead th .th-inner { display: inline-flex; align-items: center; gap: 6px; }
  tbody td { text-align: right; font-variant-numeric: tabular-nums; }
  tbody td:first-child { text-align: left; font-weight: 600; position: sticky; left: 0; z-index: 4; }
  thead th:first-child, tbody td:first-child { background: var(--panel); box-shadow: 3px 0 6px -3px rgba(0,0,0,.18); }
  tbody tr:hover td { background: var(--accent-soft); }
  tbody tr:hover td:first-child { background: var(--panel); }
  td.none { color: var(--muted); }
  .nodata-row td { text-align: center; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }

  /* ---------- 手机端适配 ---------- */
  @media (max-width: 640px) {
    body { padding: 14px 10px 40px; }
    h1 { font-size: 18px; margin-bottom: 2px; }
    .sub { font-size: 12px; margin-bottom: 12px; }
    .filters { flex-direction: row; flex-wrap: nowrap; gap: 8px; padding: 10px 12px; margin-bottom: 12px; }
    .fg { flex: 1; min-width: 0; }
    .fg > label { display: none; }              /* 筛选器不显示标题 */
    .btn { width: 100%; justify-content: center; padding: 8px 6px; font-size: 12px; }
    .cal-month:last-child { display: none; }    /* 手机端日历只显示一个月 */
    #calPop { width: calc(100vw - 60px); }
    .rank-panel { padding: 6px 12px 10px; }
    .acc-row { gap: 10px; }
    .acc-val { width: 118px; }
    .acc-val .num { font-size: 17px; }
    .table-title { padding: 10px 12px 0; }
    th, td { padding: 7px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏃 小米步数 · 每日记录</h1>
  <div class="sub" id="subTitle"></div>

  <div class="panel filters">
    <div class="fg">
      <label>日期（日历内点一天 = 单日，点两天 = 范围）</label>
      <div class="popwrap">
        <button class="btn" id="dateBtn">📅 --</button>
        <div class="popup" id="calPop">
          <div class="cal-quick">
            <button data-q="today">最新一天</button>
            <button data-q="d7">近 7 天</button>
            <button data-q="d30">近 30 天</button>
            <button data-q="d90">近 90 天</button>
            <button data-q="all">全部数据</button>
          </div>
          <div class="cal-head">
            <div class="cal-nav"><button id="calPrev">‹</button></div>
            <div class="cal-title" id="calRangeHint"></div>
            <div class="cal-nav"><button id="calNext">›</button></div>
          </div>
          <div class="cal-months" id="calMonths"></div>
          <div class="cal-foot">
            <span id="calSelHint">未选择</span>
            <button class="apply" id="calApply">应用</button>
          </div>
        </div>
      </div>
    </div>
    <div class="fg">
      <label>账号</label>
      <div class="popwrap">
        <button class="btn" id="accBtn">👤 全部账号</button>
        <div class="popup" id="accPop">
          <div class="acc-actions">
            <button id="accAll">全选</button>
            <button id="accNone">清空</button>
          </div>
          <div id="accList"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel rank-panel" id="rankBox"></div>
  <div class="panel table-panel" id="tableBox" style="display:none"></div>
</div>

<script>
"use strict";
const ACCOUNTS = DATA.accounts;
const PALETTE = ["#4285F4","#EA4335","#34A853","#F4A900","#9334E6","#00ACC1","#FF7043",
                 "#7CB342","#5C6BC0","#EC407A","#26A69A","#E0930F","#8D6E63","#78909C","#D81B60"];
const ACC_COLOR = Object.fromEntries(ACCOUNTS.map((a, i) => [a, PALETTE[i % PALETTE.length]]));
const NICK = DATA.nicknames || {};
const disp = a => NICK[a] || a;   // 有昵称显示昵称，否则显示（脱敏）账号
const ALL_DATES = Object.keys(DATA.data).sort();
const fmt = n => n == null ? "—" : n.toLocaleString("en-US");
const MEDALS = ["🥇", "🥈", "🥉"];

/* ---------------- 状态 ---------------- */
const state = {
  selStart: null, selEnd: null,          // 待应用的日历选择（未点应用）
  applied: { start: null, end: null },   // 已应用的日期（start === end 即单日）
  accounts: new Set(ACCOUNTS),
  calView: null,                          // 日历左格 {y, m}
};

/* ---------------- 工具 ---------------- */
const pad = n => String(n).padStart(2, "0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, dd] = s.split("-").map(Number); return new Date(y, m - 1, dd); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const clampDate = s => s < ALL_DATES[0] ? ALL_DATES[0] : (s > ALL_DATES[ALL_DATES.length - 1] ? ALL_DATES[ALL_DATES.length - 1] : s);
const dateList = (a, b) => { const out = []; let c = a; while (c <= b) { out.push(c); c = addDays(c, 1); } return out; };

/* ---------------- 弹层开关 ---------------- */
function bindPopup(btnId, popId) {
  const btn = document.getElementById(btnId), pop = document.getElementById(popId);
  btn.addEventListener("click", e => {
    e.stopPropagation();
    const open = pop.classList.contains("open");
    document.querySelectorAll(".popup").forEach(p => p.classList.remove("open"));
    if (!open) pop.classList.add("open");
  });
  pop.addEventListener("click", e => e.stopPropagation());
}
bindPopup("dateBtn", "calPop");
bindPopup("accBtn", "accPop");
document.addEventListener("click", () => document.querySelectorAll(".popup").forEach(p => p.classList.remove("open")));

/* ---------------- 账号筛选 ---------------- */
function renderAccList() {
  const box = document.getElementById("accList");
  box.innerHTML = "";
  ACCOUNTS.forEach(a => {
    const item = document.createElement("label");
    item.className = "acc-item";
    const dot = `<span class="dot" style="background:${ACC_COLOR[a]}"></span>`;
    item.innerHTML = `${dot}<input type="checkbox" ${state.accounts.has(a) ? "checked" : ""}> <span>${disp(a)}</span>`;
    item.querySelector("input").addEventListener("change", e => {
      e.target.checked ? state.accounts.add(a) : state.accounts.delete(a);
      if (state.accounts.size === 0) state.accounts.add(a); // 至少保留一个
      syncAccBtn(); renderAll(); renderAccList();
    });
    box.appendChild(item);
  });
}
function syncAccBtn() {
  document.getElementById("accBtn").textContent =
    state.accounts.size === ACCOUNTS.length ? "👤 全部账号" : `👤 ${state.accounts.size} / ${ACCOUNTS.length} 个账号`;
}
document.getElementById("accAll").addEventListener("click", () => { state.accounts = new Set(ACCOUNTS); syncAccBtn(); renderAccList(); renderAll(); });
document.getElementById("accNone").addEventListener("click", () => { state.accounts = new Set([ACCOUNTS[0]]); syncAccBtn(); renderAccList(); renderAll(); });

/* ---------------- 日历（点一天=单日，点两天=范围） ---------------- */
function openCal() {
  const base = state.applied.end || ALL_DATES[ALL_DATES.length - 1] || dstr(new Date());
  state.selStart = state.applied.start;
  state.selEnd = state.applied.start === state.applied.end ? null : state.applied.end;
  const d = parseD(base);
  state.calView = { y: d.getFullYear(), m: d.getMonth() };
  renderCal();
}
function monthData(y, m) {
  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7; // 周一开头
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(`${y}-${pad(m + 1)}-${pad(d)}`);
  while (cells.length % 7) cells.push(null);
  return cells;
}
function renderCal() {
  const { y, m } = state.calView;
  const box = document.getElementById("calMonths");
  box.innerHTML = "";
  for (let k = 0; k < 2; k++) {
    const cm = new Date(y, m + k, 1);
    const mon = document.createElement("div");
    mon.className = "cal-month";
    mon.innerHTML = `<h4>${cm.getFullYear()} 年 ${cm.getMonth() + 1} 月</h4>`;
    const grid = document.createElement("div");
    grid.className = "cal-grid";
    ["一","二","三","四","五","六","日"].forEach(w => {
      const c = document.createElement("div"); c.className = "dow"; c.textContent = w; grid.appendChild(c);
    });
    monthData(cm.getFullYear(), cm.getMonth()).forEach(ds => {
      const c = document.createElement("div");
      if (!ds) { grid.appendChild(c); return; }
      c.className = "cal-day";
      c.textContent = Number(ds.slice(8));
      if (ds < ALL_DATES[0] || ds > ALL_DATES[ALL_DATES.length - 1]) c.classList.add("dim");
      else if (DATA.data[ds]) c.classList.add("hasdata");
      const a = state.selStart;
      const b = state.selEnd == null ? a : state.selEnd;
      if (a && ds >= a && ds <= b) {
        c.classList.add("inrange");
        if (ds === a) { c.classList.add("selstart"); c.classList.remove("inrange"); }
        if (ds === b) { c.classList.add("selend"); c.classList.remove("inrange"); }
        if (a === b && ds === a) c.classList.add("samesel");
      }
      c.addEventListener("click", () => pickDay(ds));
      grid.appendChild(c);
    });
    mon.appendChild(grid);
    box.appendChild(mon);
  }
  const hint = !state.selStart ? "点击选择日期"
    : state.selEnd == null ? `已选起点 ${state.selStart}，再点一天结束（同一天 = 只看单日）`
    : state.selStart === state.selEnd ? `单日：${state.selStart}`
    : `范围：${state.selStart} ~ ${state.selEnd}（${dateList(state.selStart, state.selEnd).length} 天）`;
  document.getElementById("calSelHint").textContent = hint;
  document.getElementById("calRangeHint").textContent =
    `${y} 年 ${m + 1} 月 ~ ${new Date(y, m + 1, 1).getFullYear()} 年 ${new Date(y, m + 1, 1).getMonth() + 1} 月`;
}
function pickDay(ds) {
  if (!state.selStart || state.selEnd != null) { state.selStart = ds; state.selEnd = null; }   // 开始新一轮
  else if (ds < state.selStart) { state.selEnd = state.selStart; state.selStart = ds; }        // 点了更早的 → 交换
  else { state.selEnd = ds; }                                                                   // 单日或范围完成
  renderCal();
}
document.getElementById("calPrev").addEventListener("click", () => { state.calView.m--; if (state.calView.m < 0) { state.calView.m = 11; state.calView.y--; } renderCal(); });
document.getElementById("calNext").addEventListener("click", () => { state.calView.m++; if (state.calView.m > 11) { state.calView.m = 0; state.calView.y++; } renderCal(); });
document.querySelectorAll(".cal-quick button").forEach(b => b.addEventListener("click", () => {
  const last = ALL_DATES[ALL_DATES.length - 1];
  const q = b.dataset.q;
  if (q === "today") { state.selStart = last; state.selEnd = last; }        // 最新一天（单日）
  else if (q === "all") { state.selStart = ALL_DATES[0]; state.selEnd = last; }
  else {
    const n = q === "d7" ? 6 : q === "d30" ? 29 : 89;
    state.selStart = clampDate(addDays(last, -n)); state.selEnd = last;
  }
  const d = parseD(state.selEnd); state.calView = { y: d.getFullYear(), m: d.getMonth() };
  renderCal();
}));
document.getElementById("calApply").addEventListener("click", () => {
  if (!state.selStart) return;
  state.applied.start = state.selStart;
  state.applied.end = state.selEnd == null ? state.selStart : state.selEnd;
  document.getElementById("calPop").classList.remove("open");
  syncDateBtn(); renderAll();
});
function syncDateBtn() {
  const { start, end } = state.applied;
  document.getElementById("dateBtn").textContent =
    !start ? "📅 请选择日期" : start === end ? `📅 ${start}` : `📅 ${start} ~ ${end}`;
}

/* ---------------- 单日：账号榜单 ---------------- */
function renderRank(dates) {
  const box = document.getElementById("rankBox");
  const accs = ACCOUNTS.filter(a => state.accounts.has(a));
  const d = dates[0];

  if (!accs.length) {
    box.innerHTML = `<div class="empty">请选择账号</div>`;
    return;
  }

  // 收集 (账号, 值)
  const pairs = accs.map(a => ({ a, v: (DATA.data[d] || {})[a] })).filter(p => p.v != null);

  if (!pairs.length) {
    box.innerHTML = `<div class="empty">该日期没有数据</div>`;
    return;
  }

  const rows = pairs.map(p => ({ a: p.a, v: p.v })).sort((x, y) => y.v - x.v);
  const maxMain = Math.max(...rows.map(r => r.v));

  // 汇总条：只报日期与账号数
  let html = `<div class="summary-strip"><span>📅 <b>${d}</b></span><span>账号 <b>${rows.length}</b></span></div>`;

  // 账号行
  rows.forEach((r, i) => {
    const w = Math.max(2, r.v / maxMain * 100);
    const extra = r.v === maxMain ? "当日第一" : `为最高的 ${Math.round(r.v / maxMain * 100)}%`;
    html += `
      <div class="acc-row">
        <div class="rank-no">${i < 3 ? MEDALS[i] : i + 1}</div>
        <div class="avatar" style="background:${ACC_COLOR[r.a]}">${disp(r.a).slice(0, 2)}</div>
        <div class="acc-main">
          <div class="acc-name">${disp(r.a)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${ACC_COLOR[r.a]}"></div></div>
        </div>
        <div class="acc-val">
          <div class="num">${fmt(r.v)}<span class="unit">步</span></div>
          <div class="extra">${extra}</div>
        </div>
      </div>`;
  });
  box.innerHTML = html;
}

/* ---------------- 范围：每日明细表（主展示） ---------------- */
function renderTable(dates) {
  const box = document.getElementById("tableBox");
  const accs = ACCOUNTS.filter(a => state.accounts.has(a));
  if (!accs.length) { box.innerHTML = '<div class="empty">请选择账号</div>'; box.style.display = ""; return; }
  let html = `<div class="table-title">每日步数（${dates.length} 天）</div><table><thead><tr><th>日期</th>`;
  html += accs.map(a => `<th><span class="th-inner"><span class="dot" style="background:${ACC_COLOR[a]}"></span>${disp(a)}</span></th>`).join("");
  html += "</tr></thead><tbody>";
  [...dates].reverse().forEach(d => {
    const row = DATA.data[d];
    if (!row || !Object.keys(row).length) {
      html += `<tr class="nodata-row"><td>${d}</td><td colspan="${accs.length}">无数据</td></tr>`;
      return;
    }
    html += `<tr><td>${d}</td>` + accs.map(a => {
      const v = row[a];
      return v == null ? '<td class="none">—</td>' : `<td>${fmt(v)}</td>`;
    }).join("") + "</tr>";
  });
  html += "</tbody></table>";
  box.innerHTML = html;
  box.style.display = "";
}

/* ---------------- 主渲染：单日→榜单，范围→每日明细表 ---------------- */
function renderAll() {
  const dates = dateList(state.applied.start, state.applied.end);
  const rankBox = document.getElementById("rankBox");
  if (dates.length === 1) {
    rankBox.style.display = "";
    renderRank(dates);
    document.getElementById("tableBox").style.display = "none";
  } else {
    rankBox.style.display = "none";
    renderTable(dates);
  }
}

/* ---------------- 初始化（默认最新一天） ---------------- */
const LATEST = ALL_DATES[ALL_DATES.length - 1];
document.getElementById("subTitle").textContent =
  `数据范围 ${ALL_DATES[0]} ~ ${LATEST} · 共 ${ALL_DATES.length} 天 · ${ACCOUNTS.length} 个账号 · 更新于 ${DATA.updated_at.replace("T", " ").slice(0, 16)}`;
state.applied.start = LATEST;
state.applied.end = LATEST;
syncDateBtn(); syncAccBtn(); renderAccList(); renderAll();
document.getElementById("dateBtn").addEventListener("click", openCal);
</script>
